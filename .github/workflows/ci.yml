# psytwill's first CI.
#
# This is the easy one of the family, and deliberately looks it. psytwill's
# dependencies are numpy + pandas + scikit-learn and nothing else: it consumes
# the siblings' scores CSVs, never raw stimuli, so it downloads no weights and
# needs no GPU. `pip install -e ".[dev]"` is therefore the whole install — no
# hand-curated subset like viz2psy's, and one source of truth in pyproject.
#
# Keep it that way. A heavy dependency arriving here would mean psytwill had
# started doing a sibling's job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, to separate "this diff broke it" from "a dependency moved under
  # us". Every bound in this repo floats (`numpy>=1.24`, `pandas>=1.5`,
  # `scikit-learn>=1.3`), and pandas 3 is recent enough that a point release
  # can still change behaviour underneath an unchanged repo. Without a
  # scheduled run that failure lands on whoever pushes next and reads as
  # theirs.
  #
  # Monday 15:29 UTC — start of the working week in Eugene, off the hour where
  # GitHub's scheduler is least congested, and offset from duckbrain (15:43)
  # and viz2psy (15:17) so the family does not queue against itself.
  #
  # Two caveats: a scheduled failure is reported against the last commit on
  # main, which did not cause it — read the trigger before the commit. And
  # **GitHub disables a scheduled workflow in a public repo after 60 days with
  # no repository activity**, so a quiet period switches this off silently;
  # re-enable from the Actions tab rather than assuming it has been running.
  schedule:
    - cron: "29 15 * * 1"

concurrency:
  # Keyed on the event as well as the ref: `github.ref` is `refs/heads/main`
  # for both a push and a cron, so without the event they share a group and
  # `cancel-in-progress` lets the weekly run kill a real one.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The ends of the declared range: 3.10 is the `requires-python` floor and
      # 3.12 the highest classifier. 3.13 also passes (227/227, measured
      # 2026-08-29) — if the classifiers ever grow a 3.13 entry, add the leg
      # here in the same commit rather than discovering it later.
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import check
        # Cheap, and it covers what the suite structurally cannot: cli.py defers
        # its heavy imports into the command functions to keep `--help` fast, so
        # a syntax error inside one of those deferred paths is invisible to an
        # import of the package alone. compileall reaches it.
        #
        # Deliberately not bare `python -m compileall -q src/`: that prints
        # "Can't list 'src/'" and **exits 0** when the path is wrong, so the day
        # the layout moves the step keeps passing while checking nothing. Assert
        # the tree is there before trusting a green compile.
        run: |
          python -c "import psytwill; print('psytwill', psytwill.__version__)"
          python - <<'PY'
          import compileall, pathlib, sys

          mods = sorted(pathlib.Path("src/psytwill").glob("*.py"))
          if len(mods) < 5:
              sys.exit(f"only {len(mods)} modules under src/psytwill — layout moved?")
          print(f"compiling {len(mods)} modules")
          sys.exit(0 if compileall.compile_dir("src", quiet=1) else 1)
          PY

      - name: CLI smoke test
        # Deliberately only asserts that the entry point runs and prints usage.
        #
        # It was drafted as a laziness check — CLAUDE.md says cli.py defers heavy
        # imports "so `--help` stays fast (~0.3 s)" — and that check FAILS today.
        # `import psytwill.cli` pulls in sklearn, pandas, numpy and pyarrow,
        # because lines 40-41 import DEFAULT_K from psytwill.compare and
        # DEFAULT_RANK_CAP from psytwill.decompose at module scope for two
        # constants, and those modules import the stack. Measured `--help` in a
        # cold venv: 1.17 s (2026-08-29).
        #
        # It costs nothing but startup time — every one of those is a mandatory
        # dependency, so nothing fails to import — which is why it went
        # unnoticed. The fix is to move the two constants somewhere import-free
        # and then turn this step into the real assertion:
        #
        #   assert "sklearn" not in sys.modules
        #
        # Left as a smoke test rather than written as a passing gate, because a
        # gate that passes only because the property it names is already broken
        # reads to the next person as "the deferral is verified".
        run: |
          python - <<'PY'
          import subprocess, sys

          r = subprocess.run([sys.executable, "-m", "psytwill.cli", "--help"],
                             capture_output=True, text=True)
          if r.returncode != 0:
              sys.exit(f"`psytwill --help` exited {r.returncode}:\n{r.stderr}")
          if "usage" not in r.stdout.lower():
              sys.exit(f"`psytwill --help` printed no usage line:\n{r.stdout[:400]}")
          print(r.stdout.splitlines()[0])
          PY

      - name: Tests
        # Measured 2026-08-29: 227 passed on 3.10, 3.12 and 3.13.
        # `-rs` so a skip that appears later prints its reason rather than a
        # bare `s`.
        run: pytest -q -rs
