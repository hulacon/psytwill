[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "psytwill"
version = "0.10.0"
description = "Chunk-by-chunk relational matrices (RDMs, coherence curves) from word2psy and viz2psy feature CSVs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Ben Hutchinson", email = "bhutch@uoregon.edu"},
]
keywords = [
    "RSA",
    "representational similarity",
    "RDM",
    "narrative",
    "psycholinguistics",
    "psychology",
    "cognitive neuroscience",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# pyarrow is a *test* dependency, not a runtime one: psytwill writes parquet
# through pandas, which needs an engine, and 40 of the 227 tests exercise
# that path. Without it a fresh `pip install -e ".[dev]"` gives 40 failures
# that look like broken code and are not (measured 2026-08-29).
dev = ["pytest", "ipython", "pyarrow"]

[project.scripts]
psytwill = "psytwill.cli:main"

[project.urls]
Homepage = "https://github.com/hulacon/psytwill"
Repository = "https://github.com/hulacon/psytwill"
Issues = "https://github.com/hulacon/psytwill/issues"

[tool.setuptools.packages.find]
where = ["src"]
